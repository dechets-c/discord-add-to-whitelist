[project]
name = "minecraft-auto-whitelist"
version = "1.1.0"
description = "A simple bot to auto add to whitelist player"
readme = "README.md"
authors = [
    { name = "BuildTools", email = "unconfigured@null.spigotmc.org" }
]
requires-python = ">=3.14"
dependencies = [
    "discord>=2.3.2",
    "mcrcon>=0.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
minecraft-auto-whitelist = "minecraft_auto_whitelist.bot:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]



[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
push_tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Release {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "src/minecraft_auto_whitelist/__init__.py"