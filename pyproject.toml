[project]
name = "minecraft-auto-whitelist"
version = "0.1.0"
description = "A simple bot to auto add to whitelist player"
readme = "README.md"
authors = [
    { name = "BuildTools", email = "unconfigured@null.spigotmc.org" }
]
requires-python = ">=3.14"
dependencies = [
    "discord>=2.3.2",
    "mcrcon>=0.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
minecraft-auto-whitelist = "minecraft_auto_whitelist.bot:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
